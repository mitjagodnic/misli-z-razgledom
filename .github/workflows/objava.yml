# Zgradi stran iz vsebina/ (build.py) in jo objavi na GitHub Pages.
# Teče ob vsaki spremembi, tudi ko Uroš shrani vsebino v urejevalniku (/urednik/).
name: Objava strani

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gradnja strani
        run: python build.py
        env:
          OSNOVA: /misli-z-razgledom/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stran

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
